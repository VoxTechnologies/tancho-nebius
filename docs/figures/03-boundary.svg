<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/></marker></defs><rect width="1800" height="1200" fill="#ffffff"/><text x="80" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#111827" font-weight="600" text-anchor="start">What the model decides, and what it must not</text><rect x="80" y="200" width="780" height="760" rx="10" fill="#eef2ff" stroke="#1d4ed8" stroke-width="3"/><rect x="940" y="200" width="780" height="760" rx="10" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="120" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#1d4ed8" font-weight="600" text-anchor="start">Tancho (Cosmos 3 Edge fine-tune)</text><text x="980" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#111827" font-weight="600" text-anchor="start">Deterministic components</text><text x="120" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#111827" font-weight="400" text-anchor="start">- scene judgment: is the goal met</text><text x="120" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#111827" font-weight="400" text-anchor="start">- what is missing, and why</text><text x="120" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#111827" font-weight="400" text-anchor="start">- which viewpoint to take next</text><text x="980" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#111827" font-weight="400" text-anchor="start">- object detection</text><text x="980" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#111827" font-weight="400" text-anchor="start">- area extraction</text><text x="980" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#111827" font-weight="400" text-anchor="start">- route compilation</text><text x="980" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#111827" font-weight="400" text-anchor="start">- limit checking</text><text x="980" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#111827" font-weight="400" text-anchor="start">- flight control</text><text x="980" y="730" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#111827" font-weight="400" text-anchor="start">- capture verification</text><text x="120" y="880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">2.44B parameters, 4.537 GiB in BF16</text><text x="980" y="880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">auditable, testable, no sampling</text><text x="80" y="1070" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5b6472" font-weight="400" text-anchor="start">Measured 2026-09-11: an off-the-shelf COCO detector scored F1 0.588 on finding people from the air,</text><text x="80" y="1112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5b6472" font-weight="400" text-anchor="start">against 0.024 to 0.065 for the parent model. Detection left the language model that day.</text></svg>