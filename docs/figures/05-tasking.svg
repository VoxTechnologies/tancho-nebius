<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/></marker></defs><rect width="1800" height="1200" fill="#ffffff"/><text x="80" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#111827" font-weight="600" text-anchor="start">Choosing the Nemotron variant for the tasking step</text><text x="80" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">16 cases, frozen before any model was called. A square is one case: filled means the profile, the category and every required question were exact.</text><text x="80" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#111827" font-weight="600" text-anchor="start">NVIDIA-Nemotron-3-Nano-30B-A3B</text><text x="80" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">median 2.41 s</text><rect x="600" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="660" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="720" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="780" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="840" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="900" y="246" width="44" height="44" rx="6" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><rect x="960" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1020" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1080" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1140" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1200" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1260" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1320" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1380" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1440" y="246" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1500" y="246" width="44" height="44" rx="6" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="1620" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#111827" font-weight="600" text-anchor="start">14 / 16</text><text x="80" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#111827" font-weight="600" text-anchor="start">Nemotron-3_5-Lightning</text><text x="80" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">median 6.53 s</text><rect x="600" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="660" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="720" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="780" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="840" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="900" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="960" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1020" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1080" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1140" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1200" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1260" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1320" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1380" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1440" y="416" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1500" y="416" width="44" height="44" rx="6" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="1620" y="454" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#111827" font-weight="600" text-anchor="start">15 / 16</text><text x="80" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#111827" font-weight="600" text-anchor="start">nemotron-3-super-120b-a12b</text><text x="80" y="664" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">median 4.28 s</text><rect x="600" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="660" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="720" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="780" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="840" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="900" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="960" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1020" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1080" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1140" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1200" y="586" width="44" height="44" rx="6" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><rect x="1260" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1320" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1380" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1440" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><rect x="1500" y="586" width="44" height="44" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="1620" y="624" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#111827" font-weight="600" text-anchor="start">15 / 16</text><text x="80" y="880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5b6472" font-weight="400" text-anchor="start">With 16 cases, 15/16 and 14/16 are not meaningfully different. What the measurement supports is that the 30B-A3B class is</text><text x="80" y="922" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5b6472" font-weight="400" text-anchor="start">enough for this step, and that the 120B model buys nothing here.</text></svg>