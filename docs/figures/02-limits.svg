<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/></marker></defs><rect width="1800" height="1200" fill="#ffffff"/><text x="80" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#111827" font-weight="600" text-anchor="start">The compiler rejects a proposal that breaks a limit</text><rect x="620" y="430" width="900" height="530" rx="10" fill="#f8fafc" stroke="#d6dae1" stroke-width="2" stroke-dasharray="8 8"/><line x1="620" y1="430" x2="1520" y2="430" stroke="#b45309" stroke-width="4"/><text x="1540" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#b45309" font-weight="600" text-anchor="start">ceiling 12.0 m</text><text x="644" y="924" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">approved volume, fixed before takeoff</text><circle cx="1000" cy="330" r="14" fill="#b45309"/><text x="1030" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#b45309" font-weight="600" text-anchor="start">proposal: 14.39 m, pitch -44.8 deg</text><text x="1030" y="362" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">outside the volume, rejected before the aircraft moves</text><circle cx="1000" cy="660" r="14" fill="#15803d"/><text x="1030" y="652" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#15803d" font-weight="600" text-anchor="start">accepted: inside the volume, pitch -40 deg</text><text x="1030" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">dwell and pixels on target also satisfied</text><text x="80" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#111827" font-weight="600" text-anchor="start">Every proposal is checked against</text><text x="80" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5b6472" font-weight="400" text-anchor="start">- approved volume</text><text x="80" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5b6472" font-weight="400" text-anchor="start">- altitude ceiling</text><text x="80" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5b6472" font-weight="400" text-anchor="start">- obstacle clearance</text><text x="80" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5b6472" font-weight="400" text-anchor="start">- dwell time</text><text x="80" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5b6472" font-weight="400" text-anchor="start">- pixels on target</text><text x="80" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5b6472" font-weight="400" text-anchor="start">- collision-free round trip</text><text x="80" y="1090" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5b6472" font-weight="400" text-anchor="start">The model proposes. It never authorises a flight.</text></svg>