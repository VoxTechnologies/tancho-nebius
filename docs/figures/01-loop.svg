<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/></marker></defs><rect width="1800" height="1200" fill="#ffffff"/><text x="80" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#111827" font-weight="600" text-anchor="start">One observation cycle</text><rect x="80" y="240" width="360" height="230" rx="10" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="108" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#111827" font-weight="600" text-anchor="start">1  Capture</text><text x="108" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">the aircraft takes a</text><text x="108" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">frame</text><line x1="452" y1="355" x2="488" y2="355" stroke="#5b6472" stroke-width="2.5" marker-end="url(#a)"/><rect x="500" y="240" width="360" height="230" rx="10" fill="#eef2ff" stroke="#1d4ed8" stroke-width="3"/><text x="528" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#111827" font-weight="600" text-anchor="start">2  Judge</text><text x="528" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">Tancho reads the frame</text><text x="528" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">against the goal</text><line x1="872" y1="355" x2="908" y2="355" stroke="#5b6472" stroke-width="2.5" marker-end="url(#a)"/><rect x="920" y="240" width="360" height="230" rx="10" fill="#eef2ff" stroke="#1d4ed8" stroke-width="3"/><text x="948" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#111827" font-weight="600" text-anchor="start">3  Propose</text><text x="948" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">Tancho names the next</text><text x="948" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">viewpoint</text><line x1="1292" y1="355" x2="1328" y2="355" stroke="#5b6472" stroke-width="2.5" marker-end="url(#a)"/><rect x="1340" y="240" width="360" height="230" rx="10" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="1368" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#111827" font-weight="600" text-anchor="start">4  Compile</text><text x="1368" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">deterministic path +</text><text x="1368" y="394" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">limit checks</text><rect x="80" y="640" width="360" height="230" rx="10" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="108" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#111827" font-weight="600" text-anchor="start">5  Fly</text><text x="108" y="758" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">PX4 flies the approved</text><text x="108" y="794" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">path</text><line x1="452" y1="755" x2="488" y2="755" stroke="#5b6472" stroke-width="2.5" marker-end="url(#a)"/><rect x="500" y="640" width="360" height="230" rx="10" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="528" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#111827" font-weight="600" text-anchor="start">6  Re-capture</text><text x="528" y="758" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">the new frame arrives</text><line x1="872" y1="755" x2="908" y2="755" stroke="#5b6472" stroke-width="2.5" marker-end="url(#a)"/><rect x="920" y="640" width="360" height="230" rx="10" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="948" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#111827" font-weight="600" text-anchor="start">7  Judge again</text><text x="948" y="758" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">goal met, or go round</text><text x="948" y="794" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#5b6472" font-weight="400" text-anchor="start">once more</text><line x1="1520" y1="480" x2="260" y2="630" stroke="#5b6472" stroke-width="2.5" marker-end="url(#a)"/><text x="80" y="1060" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#5b6472" font-weight="400" text-anchor="start">Blue steps are the model. Everything else is deterministic and can be audited.</text></svg>