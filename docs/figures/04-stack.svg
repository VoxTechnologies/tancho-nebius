<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/></marker></defs><rect width="1800" height="1200" fill="#ffffff"/><text x="80" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#111827" font-weight="600" text-anchor="start">Where NVIDIA and Nebius are used</text><rect x="80" y="190" width="1640" height="130" rx="10" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="110" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#5b6472" font-weight="600" text-anchor="start">Parent model</text><text x="110" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#111827" font-weight="400" text-anchor="start">NVIDIA Cosmos 3 Edge, through NVIDIA cosmos-framework</text><rect x="80" y="340" width="1640" height="180" rx="10" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="110" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#5b6472" font-weight="600" text-anchor="start">Fine-tuning and frozen evaluation</text><text x="110" y="448" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#111827" font-weight="400" text-anchor="start">Nebius AI Cloud Serverless Jobs, gpu-h100-sxm 1gpu-16vcpu-200gb</text><text x="110" y="492" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#5b6472" font-weight="400" text-anchor="start">image pinned by digest in Nebius Container Registry; parent weights on a Nebius compute filesystem</text><rect x="80" y="540" width="1640" height="180" rx="10" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="110" y="598" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#5b6472" font-weight="600" text-anchor="start">Tasking to observation goal</text><text x="110" y="648" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#111827" font-weight="400" text-anchor="start">NVIDIA Nemotron 3.5 Lightning on Nebius Token Factory</text><text x="110" y="692" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#5b6472" font-weight="400" text-anchor="start">free text in, a validated goal out; the aircraft never sees free text</text><rect x="80" y="740" width="1640" height="180" rx="10" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="110" y="798" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#5b6472" font-weight="600" text-anchor="start">Published weights</text><text x="110" y="848" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#111827" font-weight="400" text-anchor="start">v13s/tancho, open weights, 487 files</text><text x="110" y="892" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#5b6472" font-weight="400" text-anchor="start">a token-free download matched every file</text><rect x="80" y="940" width="1640" height="180" rx="10" fill="#ffffff" stroke="#d6dae1" stroke-width="2"/><text x="110" y="998" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#5b6472" font-weight="600" text-anchor="start">On-board inference</text><text x="110" y="1048" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#111827" font-weight="400" text-anchor="start">Jetson-class board</text><text x="110" y="1092" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#5b6472" font-weight="400" text-anchor="start">measurement pending</text></svg>